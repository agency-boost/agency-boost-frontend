<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    The shell's own brand mark (BrandMark, components/app-shell.tsx; Overall.html:2612-2617) on the
    sidebar's navy, as the browser tab's icon (ADR-0086). An icon cannot read the stylesheet, so the
    tokens' values are written in: navy --color-navy, the light nodes --color-sidebar-text, the amber
    node --color-amber. src/app/icon.spec.ts holds them to globals.css.
  -->
  <rect width="32" height="32" rx="7" fill="#1b2b4b"/>
  <g transform="translate(3 3)">
    <circle cx="13" cy="5.5" r="4" fill="#edeff5"/>
    <circle cx="6" cy="19" r="4" fill="#edeff5"/>
    <circle cx="20" cy="19" r="4" fill="#f2994a"/>
    <line x1="13" y1="9" x2="6.5" y2="15.5" stroke="#edeff5" stroke-width="1.4"/>
    <line x1="13" y1="9" x2="19.5" y2="15.5" stroke="#edeff5" stroke-width="1.4"/>
  </g>
</svg>
