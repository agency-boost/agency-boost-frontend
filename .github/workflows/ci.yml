name: ci

# Pull requests, and every push to the two branches that deploy (ADR-0154): `development` is staging and
# `main` is production. Vercel builds those two itself and runs no tests of its own; a production
# deployment waits on these jobs by name (Deployment Checks, README.md § Deployment), so renaming one
# means updating that selection. A push to `development` went unchecked until Phase 18.7, and work
# lands there directly.
on:
  pull_request:
  push:
    branches: [main, development]

# Read the repository and nothing more. The quality job holds a deploy key of the backend repository, so
# every action is pinned by commit, with its version beside it, as the backend's are: a moved tag cannot
# then run new code beside the key.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Specs read the backend's OpenAPI document and constants at ../backend, where the superproject has it.
      - name: The backend's source, beside this checkout
        env:
          BACKEND_DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_KEY }}
          BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY || format('{0}/agency-boost-backend', github.repository_owner) }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: bash .github/ci/backend-beside.sh
      # Pinned rather than the runner's own copy, whose version moves with the runner image.
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 .github/ci/backend-beside.sh
      # pnpm's version comes from package.json's `packageManager`, the one Vercel reads too (plan D7).
      # No `version:` here: pnpm/action-setup refuses one that disagrees with that field, so a second pin
      # is only a second place to forget. `node-version: 24` below matches `engines.node` (24.x), which is
      # where Vercel takes its Node from.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Coverage ratchet
        run: pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build | tee build.log
        env:
          NEXT_PUBLIC_API_ORIGIN: http://localhost:3001
          NEXT_PUBLIC_APP_ENV: demo

      # The agent's daily loop runs on a mid-range Android over 4G. First Load JS is
      # the budget that protects it (docs/02-specs/nfr/performance-and-scale.md).
      #
      # It reads Next's own First Load JS figure — gzipped, shared chunks only. An
      # earlier version measured `du .next/static/chunks`, which is uncompressed,
      # counts every route's chunk and the legacy polyfills, and so reported 766 kB
      # for a page whose real cost is 102 kB.
      - name: First Load JS budget
        run: node scripts/check-bundle-size.mjs < build.log

      # The sign-in screen offers the seeded development accounts, which is safe only in
      # environments that run against the seeded tenant — `next dev` and staging
      # (ADR-0041). Two build-time gates keep the strings out of every other build; this
      # proves they worked, because a runtime-only guard hid the panel and shipped the
      # credentials anyway.
      #
      # The build above sets NEXT_PUBLIC_APP_ENV=demo: the value the prospect-facing demo
      # deployment itself sets (ADR-0041, amended 2026-10-01), so the artifact checked is the
      # one an office being shown the product would load. Nothing else in src reads the
      # variable, so the First Load JS figure above is that same build's. The check must hold
      # whatever the value is, so it is still asserted against the artifact, not the config.
      - name: No development credentials in the build output
        run: pnpm check:secrets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
