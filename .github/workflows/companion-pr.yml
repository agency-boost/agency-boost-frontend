name: companion pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# This repository is a submodule of the agency-boost superproject (ADR-0009), so a change
# spanning code and docs is two commits in two repositories and no single job can verify
# they ship together. This is the review-time control: a PR touching src/ must name its
# companion superproject PR, or explicitly opt out. The durable counterpart is the
# submodule pointer bump in the superproject.
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Does this PR touch src/?
        id: scope
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^src/'; then
            echo "touches_src=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches_src=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Companion docs PR is named
        if: steps.scope.outputs.touches_src == 'true'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE 'agency-boost(-docs)?.*(pull|#[0-9]+)|docs:none'; then
            if printf '%s' "$BODY" | grep -qi 'docs:none'; then
              echo "::warning::docs:none claimed — reviewer must confirm this is a pure refactor."
            fi
            exit 0
          fi
          echo "::error::This PR touches src/ but names no companion docs PR."
          echo "::error::Link the agency-boost superproject PR, or write 'docs:none' with a justification."
          exit 1
